name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze & test
        working-directory: app
        run: |
          flutter analyze
          flutter test

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Zip APK
        run: |
          TAG="${{ inputs.tag }}"
          cd app/build/app/outputs/flutter-apk
          zip -j "$GITHUB_WORKSPACE/tsuritomo-$TAG-android-apk.zip" app-release.apk
          ls -la "$GITHUB_WORKSPACE/tsuritomo-$TAG-android-apk.zip"

      - name: Attach to release and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          ZIP="$GITHUB_WORKSPACE/tsuritomo-$TAG-android-apk.zip"
          # リリース（ドラフト含む）が無ければ作る
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY"; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG（釣りとも！）" --notes "Android APK"
          fi
          gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
